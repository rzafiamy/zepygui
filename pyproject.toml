[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pygui-desktop"
version = "0.1.0"
description = "Beautiful native desktop apps in pure Python, with no dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Rija Z." }]
dependencies = []

[tool.setuptools]
packages = ["pygui"]

[tool.setuptools.package-data]
pygui = ["static/*"]
